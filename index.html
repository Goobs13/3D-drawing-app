<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Bounded Canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Bounded Sketchpad</h1>
        <p>The yellow sketchpad is now a fixed size.</p>
        <p>Left Click + Drag: <b>Draw inside the yellow pad</b><br>Right Click + Drag: <b>Orbit Camera</b></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. CHANGED: Shrunk PlaneGeometry from (25, 25) to (8, 8)
        const planeGeometry = new THREE.PlaneGeometry(8, 8);
        const planeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const visualPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        visualPlane.rotation.x = -Math.PI / 2; // Rotates it flat like a floor
        visualPlane.position.y = 0.01;         // Sits slightly above the grid to avoid flickering
        scene.add(visualPlane);

        // Create a sharp, less transparent border around the edges
        const borderEdges = new THREE.EdgesGeometry(planeGeometry);
        const borderMaterial = new THREE.LineBasicMaterial({ 
            color: 0xffcc00, 
            transparent: true, 
            opacity: 0.8             // 80% opaque so it stands out clearly
        });
        const border = new THREE.LineSegments(borderEdges, borderMaterial);

        // Add the border as a child of the plane so they stay locked together
        visualPlane.add(border);

        // 6. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        let currentStrokePoints = [];
        let currentStrokeMesh = null;

        // 7. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            if (event.button === 0) { 
                isDrawing = true;
                currentStrokePoints = [];
                currentStrokeMesh = null;
                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) {
                isDrawing = false;
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) {
                addPoint(event);
            }
        });

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // CHANGED: Instead of an infinite math plane, we test collisions 
            // directly against our physical 8x8 yellow canvas mesh.
            const intersects = raycaster.intersectObject(visualPlane);
            
            // Only draw if the raycaster laser actually hits the yellow square
            if (intersects.length > 0) {
                const intersectionPoint = intersects[0].point;

                if (currentStrokePoints.length > 0) {
                    const lastPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    if (intersectionPoint.distanceTo(lastPoint) < 0.1) return;
                }

                currentStrokePoints.push(intersectionPoint.clone());

                if (currentStrokePoints.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(currentStrokePoints);
                    const geometry = new THREE.TubeGeometry(curve, currentStrokePoints.length * 2, 0.08, 8, false);
                    const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });

                    if (currentStrokeMesh) {
                        scene.remove(currentStrokeMesh);
                        currentStrokeMesh.geometry.dispose();
                    }

                    currentStrokeMesh = new THREE.Mesh(geometry, material);
                    scene.add(currentStrokeMesh);
                }
            }
        }

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
        
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
