<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Screen Plane</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Screen-Plane Drawing</h1>
        <p>Right Click + Drag to rotate the world, then Left Click to sketch from that angle!</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,      // Drawing
            MIDDLE: THREE.MOUSE.DOLLY,   // Zoom
            RIGHT: THREE.MOUSE.ROTATE    // Camera Orbit
        };

        // 3. Visual Grid Floor (just for spatial reference now)
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        // Initialize an empty mathematical plane
        const drawingPlane = new THREE.Plane();

        // 6. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            if (event.button === 0) { 
                isDrawing = true;
                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) isDrawing = false;
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) addPoint(event);
        });

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // NEW MECHANIC: Calculate the direction the camera is facing
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);
            
            // Invert it so the plane's face normal points back at the camera
            const planeNormal = cameraDirection.clone().negate();

            // Set the plane to face the camera, slicing exactly through the center pivot point
            drawingPlane.setFromNormalAndCoplanarPoint(planeNormal, controls.target);

            // Shoot the raycaster laser
            raycaster.setFromCamera(mouse, camera);
            const intersectionPoint = new THREE.Vector3();
            
            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                // Spawn the 3D drawing point
                const geometry = new THREE.SphereGeometry(0.15, 8, 8);
                const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2 });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.copy(intersectionPoint);
                scene.add(sphere);
            }
        }

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
