<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Drawing Prototype</h1>
        <p>Left Click + Drag: <b>Draw</b><br>Right Click + Drag: <b>Rotate Camera</b></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls (Remapped for drawing)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,      // Free up left click for drawing
            MIDDLE: THREE.MOUSE.DOLLY,   // Scroll wheel zooms
            RIGHT: THREE.MOUSE.ROTATE    // Right click rotates the world
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x555555, 0x333333);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        // An invisible mathematical plane sitting at Y = 0 (the grid level) to draw on
        const drawingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        // 6. Event Listeners for Mouse/Touch Input
        window.addEventListener('pointerdown', (event) => {
            if (event.button === 0) { // 0 is Left Click
                isDrawing = true;
                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) {
                isDrawing = false;
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) {
                addPoint(event);
            }
        });

        function addPoint(event) {
            // Convert standard mouse coordinates into normalized -1 to +1 space for Three.js
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Aim the raycaster laser from the camera right through the mouse position
            raycaster.setFromCamera(mouse, camera);

            const intersectionPoint = new THREE.Vector3();
            
            // Check where the laser intersects our flat floor plane
            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                // Spawn a tiny 3D sphere at that exact intersection point
                const geometry = new THREE.SphereGeometry(0.15, 8, 8);
                const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2 });
                const sphere = new THREE.Mesh(geometry, material);
                
                sphere.position.copy(intersectionPoint);
                scene.add(sphere);
            }
        }

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
