<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Bounded Canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }


        #center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none; /* Allows clicks to pass right through it */
            opacity: 0.5;         /* Keeps it subtle and translucent */
        }
        /* Horizontal line of the plus */
        #center-crosshair::before {
            content: '';
            position: absolute;
            top: 7px;
            left: 0;
            width: 16px;
            height: 2px;
            background-color: #ffffff;
        }
        /* Vertical line of the plus */
        #center-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 7px;
            width: 2px;
            height: 16px;
            background-color: #ffffff;
        }

        /* Bottom Center Panel Styling */
        #bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .bottom-btn {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 20px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        #reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffcc00; /* Yellow highlight for return */
        }
        #clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff4444; /* Red highlight for clear */
        }

        /* Top Right Save Panel Styling */
        #right-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 18px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            text-align: center;
            width: 140px;
        }
        .side-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ff88;
        }

        #undo-btn:hover, #redo-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00aaff; /* Blue highlight for history actions */
        }

        #tools-menu {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-family: sans-serif;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 220px;
            pointer-events: auto;
        }
        #tools-menu h3 { margin: 0 0 4px 0; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .menu-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .menu-row label { font-size: 13px; font-weight: bold; color: #ccc; }
        #tools-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ff88;
        }

        .menu-toggle-btn {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s;
        }
        .menu-toggle-btn.active {
            background: #00aaff;
            border-color: #00d5ff;
        }

        /* Lower Right Recent Colors Panel Style */
        #recent-colors-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-family: sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 140px;
            pointer-events: auto;
        }
        #recent-colors-panel h4 { margin: 0 0 10px 0; font-size: 12px; text-align: center; color: #ccc; text-transform: uppercase; letter-spacing: 0.5px; }
        #colors-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #555;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }
        .color-swatch:hover { transform: scale(1.15); border-color: #ffffff; }

    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Sketchpad</h1>
        <p>
            Left Click + Drag: <b>Draw inside the yellow canvas</b><br>
            Right Click + Drag: <b>Orbit Camera</b><br>
            Shift + Right Click: <b>Pan Camera</b><br>
            Shift + Scroll: <b>Change canvas height</b><br>
            Arrow Keys: <b>Rotate canvas</b>
        </p>
    </div>

    <div id="center-crosshair"></div>
    
    <div id="bottom-panel">
        <button id="tools-btn" class="bottom-btn">Tools</button>
        <button id="undo-btn" class="bottom-btn">Undo</button>
        <button id="redo-btn" class="bottom-btn">Redo</button>
        <button id="reset-btn" class="bottom-btn">Reset Canvas</button>
        <button id="clear-btn" class="bottom-btn">Clear</button>
    </div>

    <div id="tools-menu" style="display: none;">
        <h3>Tool Settings</h3>
        <div class="menu-row">
            <button id="brush-mode-btn" class="menu-toggle-btn active">Brush Mode</button>
            <button id="eraser-mode-btn" class="menu-toggle-btn">Eraser Mode</button>
        </div>
        <div class="menu-row">
            <label>Color:</label>
            <input type="color" id="brush-color" value="#00ff88">
        </div>
        <div class="menu-row">
            <label>Thickness:</label>
            <input type="range" id="brush-thickness" min="0.02" max="0.3" step="0.01" value="0.08">
        </div>
    </div>

    <div id="right-panel">
        <button id="save-json-btn" class="side-btn">Save Project</button>
        <button id="export-glb-btn" class="side-btn">Export 3D Mesh</button>
        <button id="import-btn" class="side-btn">Import Project</button>
    </div>

    <div id="recent-colors-panel">
        <h4>Recent Colors</h4>
        <div id="colors-grid"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./js/libs/three.module.js",
                "three/addons/controls/OrbitControls.js": "./js/libs/OrbitControls.js",
                "three/addons/exporters/GLTFExporter.js": "./js/libs/GLTFExporter.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 9, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.zoomSpeed = 1.8; // NEW: Values higher than 1.0 make zooming faster
        controls.screenSpacePanning = false; // Locks standard panning to X and Z axes
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. CHANGED: Shrunk PlaneGeometry from (25, 25) to (8, 8)
        const planeGeometry = new THREE.PlaneGeometry(15, 15);
        const planeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const visualPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        visualPlane.rotation.x = -Math.PI / 2; // Rotates it flat like a floor
        visualPlane.position.y = 0.01;         // Sits slightly above the grid to avoid flickering
        scene.add(visualPlane);

        // Create a sharp, less transparent border around the edges
        const borderEdges = new THREE.EdgesGeometry(planeGeometry);
        const borderMaterial = new THREE.LineBasicMaterial({ 
            color: 0xffcc00, 
            transparent: true, 
            opacity: 0.8             // 80% opaque so it stands out clearly
        });
        const border = new THREE.LineSegments(borderEdges, borderMaterial);

        // Add the border as a child of the plane so they stay locked together
        visualPlane.add(border);

        // Add transparent blue lines across the local center axes of the canvas
        const axesPoints = [
            // Horizontal line across the middle (Local X)
            new THREE.Vector3(-7.5, 0, 0), new THREE.Vector3(7.5, 0, 0),
            // Vertical line across the middle (Local Y)
            new THREE.Vector3(0, -7.5, 0), new THREE.Vector3(0, 7.5, 0)
        ];
        
        const axesGeometry = new THREE.BufferGeometry().setFromPoints(axesPoints);
        const axesMaterial = new THREE.LineBasicMaterial({ 
            color: 0x00aaff, 
            transparent: true, 
            opacity: 0.4 
        });
        const localAxes = new THREE.LineSegments(axesGeometry, axesMaterial);
        
        visualPlane.add(localAxes);

        // 6. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        let currentStrokePoints = [];
        let currentStrokeMesh = null;

        // Tracks which arrow keys are currently being held down
        const keysPressed = {};

        const masterProjectData = [];

        const masterStrokeMeshes = []; // NEW: Tracks 3D meshes for undo operations
        const redoStack = [];          // NEW: Holds popped stroke data arrays

        // NEW: Dynamic brush state tracking variables
        let brushColor = '#00ff88';
        let brushThickness = 0.08;

        // NEW: Eraser tracking variables
        let isEraserMode = false;
        let hoveredGroup = null;

        let hasUnsavedChanges = false; // Tracks if the user has unsaved work

        let fileHandle = null; // NEW: Remembers the saved file location

        // 7. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            if (event.target.closest('#right-panel') || event.target.closest('#ui-overlay') || event.target.closest('#bottom-panel') || event.target.closest('#tools-menu')|| event.target.closest('#recent-colors-panel')) {
                return;
            }
            
            if (event.button === 0) { 
                // NEW: Handle Eraser click-to-delete pattern
                if (isEraserMode) {
                    if (hoveredGroup) {
                        const index = masterStrokeMeshes.indexOf(hoveredGroup);
                        if (index !== -1) {
                            // Strip memory allocations from active workspace arrays
                            masterStrokeMeshes.splice(index, 1);
                            masterProjectData.splice(index, 1);

                            // Purge VRAM completely to eliminate memory leaks
                            hoveredGroup.traverse((object) => {
                                if (object.isMesh) {
                                    if (object.geometry) object.geometry.dispose();
                                    if (object.material) object.material.dispose();
                                }
                            });
                            scene.remove(hoveredGroup);
                            hoveredGroup = null; // Blank tracking out
                            hasUnsavedChanges = true;
                        }
                    }
                } else {
                    // Default drawing execution branch
                    isDrawing = true;
                    currentStrokePoints = [];
                    currentStrokeMesh = null;
                    addPoint(event);
                }
            }
        });

        window.addEventListener('pointerup', (event) => {
            // NEW: Ignore mouse releases over UI panels so they don't corrupt history stacks
            if (event.target.closest('#right-panel') || event.target.closest('#ui-overlay') || event.target.closest('#bottom-panel') || event.target.closest('#tools-menu')|| event.target.closest('#recent-colors-panel')) {
                isDrawing = false;
                return;
            }

            if (event.button === 0) {
                isDrawing = false;
                if (currentStrokePoints.length > 0) {
                    masterProjectData.push({
                        points: currentStrokePoints,
                        color: brushColor,
                        thickness: brushThickness
                    });
                    masterStrokeMeshes.push(currentStrokeMesh); // Track mesh components
                    redoStack.length = 0;                       // Clear redo stack on new stroke execution
                    hasUnsavedChanges = true; // Mark project as modified
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isEraserMode) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                // Target intersections directly against drawn line containers
                const intersects = raycaster.intersectObjects(masterStrokeMeshes, true);

                if (intersects.length > 0) {
                    // Climb up structural tree geometry transforms to target group parent node
                    let targetGroup = intersects[0].object.parent;
                    while (targetGroup && targetGroup.type !== 'Group') {
                        targetGroup = targetGroup.parent;
                    }

                    if (hoveredGroup !== targetGroup) {
                        resetHoverHighlight(); // Revert previous target back to standard color
                        hoveredGroup = targetGroup;

                        // Mutate entire stroke geometry group colors to solid warning crimson
                        hoveredGroup.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.color.setHex(0xff4444);
                            }
                        });
                    }
                } else {
                    resetHoverHighlight(); // Clear styles when floating over empty workspace spaces
                }
            } else if (isDrawing) {
                addPoint(event);
            }
        });

        // Helper cleanup function to safely reverse color highlights back to data array states
        function resetHoverHighlight() {
            if (hoveredGroup) {
                const index = masterStrokeMeshes.indexOf(hoveredGroup);
                if (index !== -1 && masterProjectData[index]) {
                    const originalColor = masterProjectData[index].color;
                    hoveredGroup.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.color.set(originalColor);
                        }
                    });
                }
                hoveredGroup = null;
            }
        }

        // NEW: Scroll Wheel Elevator (Shift + Scroll to change height)
        window.addEventListener('wheel', (event) => {
            if (event.shiftKey) {
                // Stop OrbitControls from zooming the camera in and out
                event.stopImmediatePropagation(); 

                // Adjust sensitivity (smaller number = slower, smoother movement)
                const elevatorSpeed = event.deltaY * 0.001; 

                // NEW: Translates the plane along its perpendicular local Z-axis
                visualPlane.translateZ(-elevatorSpeed);
            }
        }, { capture: true }); // 'capture' ensures we catch the scroll before OrbitControls does

        // Turn on the switch when a key is pressed down
        window.addEventListener('keydown', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                event.preventDefault(); 
                keysPressed[event.key] = true;
            }
        });

        // Turn off the switch the moment the key is released
        window.addEventListener('keyup', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                keysPressed[event.key] = false;
            }
        });

        // Intercept tab close or reload if there are unsaved strokes
        window.addEventListener('beforeunload', (event) => {
            if (hasUnsavedChanges) {
                event.preventDefault();
                event.returnValue = ''; // Standard browser requirement to trigger the prompt
            }
        });

        // Reset button logic to clear canvas height and rotation orientation
        document.getElementById('reset-btn').addEventListener('click', () => {
            // NEW: Resets X, Y, and Z positions entirely
            visualPlane.position.set(0, 0.01, 0);
            
            // Re-align canvas flat against the grid floor
            visualPlane.rotation.set(-Math.PI / 2, 0, 0);
        });

        // Clear all artwork from the workspace after confirmation pass
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (masterProjectData.length === 0) return alert("Canvas is already empty!");

            if (confirm("Are you sure you want to clear everything?")) {
                // Wipe current drawings out of the scene, clearing GPU memory first
                scene.children.slice().forEach(child => {
                    if (child.isGroup) {
                        child.traverse((object) => {
                            if (object.isMesh) {
                                if (object.geometry) object.geometry.dispose();
                                if (object.material) {
                                    if (Array.isArray(object.material)) {
                                        object.material.forEach(mat => mat.dispose());
                                    } else {
                                        object.material.dispose();
                                    }
                                }
                            }
                        });
                        scene.remove(child);
                    }
                });

                // Reset all tracking matrices back to pristine state
                masterProjectData.length = 0;
                masterStrokeMeshes.length = 0; // NEW
                redoStack.length = 0;          // NEW
                fileHandle = null; 
                hasUnsavedChanges = false; 
            }
        });

        // Undo the last drawn or redone stroke sequence safely
        document.getElementById('undo-btn').addEventListener('click', () => {
            if (masterProjectData.length === 0) return;

            const undonePoints = masterProjectData.pop();
            const undoneMesh = masterStrokeMeshes.pop();

            redoStack.push(undonePoints); // Cache coordinates data

            if (undoneMesh) {
                undoneMesh.traverse((object) => {
                    if (object.isMesh) {
                        if (object.geometry) object.geometry.dispose();
                        if (object.material) {
                            if (Array.isArray(object.material)) {
                                object.material.forEach(mat => mat.dispose());
                            } else {
                                object.material.dispose();
                            }
                        }
                    }
                });
                scene.remove(undoneMesh);
            }
            hasUnsavedChanges = true;
        });

        // Redo the last reverted stroke structure natively
        document.getElementById('redo-btn').addEventListener('click', () => {
            if (redoStack.length === 0) return;

            const redoneStroke = redoStack.pop();
            masterProjectData.push(redoneStroke);

            const strokeGroup = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: redoneStroke.color, roughness: 0.3 });

            const startGeo = new THREE.SphereGeometry(redoneStroke.thickness, 8, 8);
            const startSphere = new THREE.Mesh(startGeo, material);
            startSphere.position.copy(redoneStroke.points[0]);
            strokeGroup.add(startSphere);

            if (redoneStroke.points.length > 1) {
                const curve = new THREE.CatmullRomCurve3(redoneStroke.points);
                const tubeGeometry = new THREE.TubeGeometry(curve, redoneStroke.points.length * 2, redoneStroke.thickness, 8, false);
                const tube = new THREE.Mesh(tubeGeometry, material);
                tube.name = "tube";
                strokeGroup.add(tube);

                const endGeo = new THREE.SphereGeometry(redoneStroke.thickness, 8, 8);
                const endSphere = new THREE.Mesh(endGeo, material);
                endSphere.position.copy(redoneStroke.points[redoneStroke.points.length - 1]);
                strokeGroup.add(endSphere);
            }

            scene.add(strokeGroup);
            masterStrokeMeshes.push(strokeGroup);
            hasUnsavedChanges = true;
        });

        // Toggle tool configuration layout visibility
        document.getElementById('tools-btn').addEventListener('click', () => {
            const menu = document.getElementById('tools-menu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        });

        // Track pickers and sliders configuration changes
        // Updates the active drawing brush color in real time
        document.getElementById('brush-color').addEventListener('input', (e) => {
            brushColor = e.target.value;
        });

        // Commits the finalized color selection to your recent palette history row
        document.getElementById('brush-color').addEventListener('change', (e) => {
            pushRecentColor(e.target.value);
        });

        document.getElementById('brush-thickness').addEventListener('input', (e) => brushThickness = parseFloat(e.target.value));

        // Swap workspace pipeline paths back to vector line compilation mechanics
        document.getElementById('brush-mode-btn').addEventListener('click', () => {
            isEraserMode = false;
            resetHoverHighlight(); // Instantly wipe stray hover states
            document.getElementById('brush-mode-btn').classList.add('active');
            document.getElementById('eraser-mode-btn').classList.remove('active');
        });

        // Swap workspace pipeline paths over to geometric raycast intersection checks
        document.getElementById('eraser-mode-btn').addEventListener('click', () => {
            isEraserMode = true;
            document.getElementById('eraser-mode-btn').classList.add('active');
            document.getElementById('brush-mode-btn').classList.remove('active');
        });

        document.getElementById('save-json-btn').addEventListener('click', async () => {
            if (masterProjectData.length === 0) return alert("Nothing to save yet!");
            
            // Bundle canvas settings and drawing data together
            const projectSaveData = {
                canvas: {
                    // FIXED: Save the true X, Y, Z coordinates of the canvas position
                    position: {
                        x: visualPlane.position.x,
                        y: visualPlane.position.y,
                        z: visualPlane.position.z
                    },
                    rotation: {
                        x: visualPlane.rotation.x,
                        y: visualPlane.rotation.y,
                        z: visualPlane.rotation.z
                    }
                },
                strokes: masterProjectData
            };
            const jsonString = JSON.stringify(projectSaveData);

            // Check if the browser supports the File System Access API
            if ('showSaveFilePicker' in window) {
                try {
                    // If we don't have a handle yet, prompt the user to choose a location
                    if (!fileHandle) {
                        const options = {
                            suggestedName: 'my-3d-drawing-project.json',
                            types: [{
                                description: 'JSON Files',
                                accept: { 'application/json': ['.json'] }
                            }]
                        };
                        fileHandle = await window.showSaveFilePicker(options);
                    }

                    // Write directly to the existing file handle
                    const writable = await fileHandle.createWritable();
                    await writable.write(jsonString);
                    await writable.close();

                    hasUnsavedChanges = false;
                    alert("Project updated successfully!");
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error(err);
                        alert("Failed to save file.");
                    }
                }
            } else {
                // Fallback for older browsers (always downloads a new file)
                const blob = new Blob([jsonString], { type: "application/json" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "my-3d-drawing-project.json";
                link.click();
                hasUnsavedChanges = false;
            }
        });

        document.getElementById('export-glb-btn').addEventListener('click', () => {
            const exporter = new GLTFExporter();
            const exportGroup = new THREE.Group();
            
            scene.children.forEach(child => {
                if (child.isGroup) exportGroup.add(child.clone());
            });

            if (exportGroup.children.length === 0) return alert("No 3D meshes to export!");

            exporter.parse(exportGroup, (gltf) => {
                const blob = new Blob([gltf], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "drawing-mesh.glb";
                link.click();
            }, (error) => {
                console.error("An error occurred during GLTF export:", error);
            }, { binary: true });
        });

        // Load an existing project and lock onto its hardware file path
        document.getElementById('import-btn').addEventListener('click', async () => {
            if ('showOpenFilePicker' in window) {
                try {
                    // Open a native system file browser
                    const [handle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'JSON Files',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });
                    
                    const file = await handle.getFile();
                    const text = await file.text();
                    
                    // Run the rendering pipeline on the JSON data
                    processImportedProject(text);
                    
                    // CRITICAL FIX: Lock the app's save tracking pointer onto this file path
                    fileHandle = handle; 
                    
                } catch (err) {
                    if (err.name !== 'AbortError') alert("Error opening project file.");
                }
            } else {
                // Backward compatibility fallback for older browsers
                const legacyInput = document.createElement('input');
                legacyInput.type = 'file';
                legacyInput.accept = '.json';
                legacyInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        processImportedProject(evt.target.result);
                        fileHandle = null; 
                    };
                    reader.readAsText(file);
                };
                legacyInput.click();
            }
        });

        // Pipeline to parse JSON structures and regenerate 3D canvas meshes
        function processImportedProject(jsonText) {
            try {
                const importedData = JSON.parse(jsonText);
                let strokesToLoad = [];

                if (importedData.canvas && Array.isArray(importedData.strokes)) {
                    // FIXED: Restore full 3D position vector if it exists, otherwise fall back to legacy height
                    if (importedData.canvas.position) {
                        visualPlane.position.set(
                            importedData.canvas.position.x,
                            importedData.canvas.position.y,
                            importedData.canvas.position.z
                        );
                    } else if (importedData.canvas.height !== undefined) {
                        visualPlane.position.set(0, importedData.canvas.height, 0);
                    }
                    
                    visualPlane.rotation.set(
                        importedData.canvas.rotation.x,
                        importedData.canvas.rotation.y,
                        importedData.canvas.rotation.z
                    );
                    strokesToLoad = importedData.strokes;
                } else if (Array.isArray(importedData)) {
                    strokesToLoad = importedData;
                } else {
                    return alert("Invalid file format.");
                }

                // Empty out old meshes and purge GPU resources
                scene.children.slice().forEach(child => {
                    if (child.isGroup) {
                        child.traverse((object) => {
                            if (object.isMesh) {
                                if (object.geometry) object.geometry.dispose();
                                if (object.material) {
                                    if (Array.isArray(object.material)) {
                                        object.material.forEach(mat => mat.dispose());
                                    } else {
                                        object.material.dispose();
                                    }
                                }
                            }
                        });
                        scene.remove(child);
                    }
                });
                masterProjectData.length = 0;
                masterStrokeMeshes.length = 0; // NEW
                redoStack.length = 0;          // NEW

                // Re-instantiate meshes from vector data paths
                strokesToLoad.forEach(strokeData => {
                    const pointsArray = (strokeData.points || strokeData).map(p => new THREE.Vector3(p.x, p.y, p.z));
                    const strokeColor = strokeData.color || '#00ff88';
                    const strokeThickness = strokeData.thickness || 0.08;

                    masterProjectData.push({
                        points: pointsArray,
                        color: strokeColor,
                        thickness: strokeThickness
                    });

                    const strokeGroup = new THREE.Group();
                    const material = new THREE.MeshStandardMaterial({ color: strokeColor, roughness: 0.3 });

                    const startGeo = new THREE.SphereGeometry(strokeThickness, 8, 8);
                    const startSphere = new THREE.Mesh(startGeo, material);
                    startSphere.position.copy(pointsArray[0]);
                    startSphere.name = "startSphere";
                    strokeGroup.add(startSphere);

                    if (pointsArray.length > 1) {
                        const curve = new THREE.CatmullRomCurve3(pointsArray);
                        const tubeGeometry = new THREE.TubeGeometry(curve, pointsArray.length * 2, strokeThickness, 8, false);
                        const tube = new THREE.Mesh(tubeGeometry, material);
                        tube.name = "tube";
                        strokeGroup.add(tube);

                        const endGeo = new THREE.SphereGeometry(strokeThickness, 8, 8);
                        const endSphere = new THREE.Mesh(endGeo, material);
                        endSphere.position.copy(pointsArray[pointsArray.length - 1]);
                        endSphere.name = "endSphere";
                        strokeGroup.add(endSphere);
                    }
                    scene.add(strokeGroup);
                    masterStrokeMeshes.push(strokeGroup);
                });

                hasUnsavedChanges = false;
            } catch (err) {
                alert("Error rendering the imported project configuration.");
            }
        }

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // CHANGED: Instead of an infinite math plane, we test collisions 
            // directly against our physical 8x8 yellow canvas mesh.
            const intersects = raycaster.intersectObject(visualPlane, false);
            
            // Only draw if the raycaster laser actually hits the yellow square
            if (intersects.length > 0) {
                const intersectionPoint = intersects[0].point;

                if (currentStrokePoints.length > 0) {
                    const lastPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    if (intersectionPoint.distanceTo(lastPoint) < 0.1) return;
                }

                currentStrokePoints.push(intersectionPoint.clone());

                // 1. Swap hardcoded hex code with brushColor variable
                const material = new THREE.MeshStandardMaterial({ color: brushColor, roughness: 0.3 });

                if (currentStrokePoints.length === 1) {
                    currentStrokeMesh = new THREE.Group(); 
                    scene.add(currentStrokeMesh);

                    // 2. Swap starting sphere radius with brushThickness
                    const geometry = new THREE.SphereGeometry(brushThickness, 8, 8);
                    const startSphere = new THREE.Mesh(geometry, material);
                    startSphere.position.copy(intersectionPoint);
                    startSphere.name = "startSphere";
                    
                    currentStrokeMesh.add(startSphere);
                } 
                else if (currentStrokePoints.length > 1) {
                    const oldTube = currentStrokeMesh.getObjectByName("tube");
                    if (oldTube) {
                        currentStrokeMesh.remove(oldTube);
                        oldTube.geometry.dispose();
                    }

                    const oldEndSphere = currentStrokeMesh.getObjectByName("endSphere");
                    if (oldEndSphere) {
                        currentStrokeMesh.remove(oldEndSphere);
                        oldEndSphere.geometry.dispose();
                    }

                    const curve = new THREE.CatmullRomCurve3(currentStrokePoints);
                    // 3. Swap tube geometry thickness with brushThickness
                    const tubeGeometry = new THREE.TubeGeometry(curve, currentStrokePoints.length * 2, brushThickness, 8, false);
                    const tube = new THREE.Mesh(tubeGeometry, material);
                    tube.name = "tube";
                    currentStrokeMesh.add(tube);

                    // 4. Swap trailing ending sphere radius with brushThickness
                    const sphereGeometry = new THREE.SphereGeometry(brushThickness, 8, 8);
                    const endSphere = new THREE.Mesh(sphereGeometry, material);
                    endSphere.position.copy(intersectionPoint);
                    endSphere.name = "endSphere";
                    currentStrokeMesh.add(endSphere);
                }
            }
        }

        // Recent Colors state configuration parameters
        const recentColorsList = ['#00ff88']; // Start with your baseline canvas green
        const maxHistorySwatches = 12;

        // Add a new color selection or push existing items directly to the front
        function pushRecentColor(hexColor) {
            if (recentColorsList[0] === hexColor) return; // Prevent spamming duplicate history records

            const existingIndex = recentColorsList.indexOf(hexColor);
            if (existingIndex !== -1) {
                recentColorsList.splice(existingIndex, 1); // Extract old index instance
            }

            recentColorsList.unshift(hexColor); // Push onto front row stack slot

            if (recentColorsList.length > maxHistorySwatches) {
                recentColorsList.pop(); // Drop overflowing historical items
            }

            renderColorsPalette();
        }

        // Generate structural interactive canvas elements inside document DOM space maps
        function renderColorsPalette() {
            const paletteGrid = document.getElementById('colors-grid');
            paletteGrid.innerHTML = ''; // Wipe stale layout states

            recentColorsList.forEach(colorHex => {
                const swatchElement = document.createElement('div');
                swatchElement.className = 'color-swatch';
                swatchElement.style.backgroundColor = colorHex;

                // Sync engine selections automatically when swatch is clicked
                swatchElement.addEventListener('click', () => {
                    brushColor = colorHex;
                    document.getElementById('brush-color').value = colorHex; // Sync floating tools picker
                });

                paletteGrid.appendChild(swatchElement);
            });
        }

        // Trigger an initial paint to populate default baseline palette matrix
        renderColorsPalette();

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
        
            // NEW: Smoothly rotates the canvas if a key switch is active
            // (Lowered speed slightly because this now executes up to 60+ times per second)
            const frameRotationSpeed = 0.007; 
            
            if (keysPressed['ArrowUp']) {
                visualPlane.rotateX(-frameRotationSpeed);
            }
            if (keysPressed['ArrowDown']) {
                visualPlane.rotateX(frameRotationSpeed);
            }
            if (keysPressed['ArrowLeft']) {
                visualPlane.rotateY(-frameRotationSpeed);
            }
            if (keysPressed['ArrowRight']) {
                visualPlane.rotateY(frameRotationSpeed);
            }
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
