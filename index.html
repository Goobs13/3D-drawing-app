<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Bounded Canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px;
            pointer-events: auto; /* Forces clicks to register on the menu */
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .tool-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .tool-btn.active {
            background: #00ff88;
            color: #1a1a1a;
        }

        #center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none; /* Allows clicks to pass right through it */
            opacity: 0.5;         /* Keeps it subtle and translucent */
        }
        /* Horizontal line of the plus */
        #center-crosshair::before {
            content: '';
            position: absolute;
            top: 7px;
            left: 0;
            width: 16px;
            height: 2px;
            background-color: #ffffff;
        }
        /* Vertical line of the plus */
        #center-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 7px;
            width: 2px;
            height: 16px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Bounded Sketchpad</h1>
        <p>
            Left Click + Drag: <b>Draw inside the yellow pad</b><br>
            Right Click + Drag: <b>Orbit Camera</b><br>
            Shift + Right Click: <b>Pan Camera</b><br>
            Shift + Scroll: <b>Change canvas height</b>
        </p>
    </div>

    <div id="toolbar" style="font-family: sans-serif; font-weight: bold; font-size: 14px;">
        <button class="tool-btn active" id="tool-draw" title="Draw">Draw</button>
        <button class="tool-btn" id="tool-rotate" title="Rotate Plane">Rotate Plane</button>
        <button class="tool-btn" id="tool-select" title="Select">Select</button>
    </div>

    <div id="center-crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.screenSpacePanning = false; // Locks standard panning to X and Z axes
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. CHANGED: Shrunk PlaneGeometry from (25, 25) to (8, 8)
        const planeGeometry = new THREE.PlaneGeometry(15, 15);
        const planeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const visualPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        visualPlane.rotation.x = -Math.PI / 2; // Rotates it flat like a floor
        visualPlane.position.y = 0.01;         // Sits slightly above the grid to avoid flickering
        scene.add(visualPlane);

        // Create a sharp, less transparent border around the edges
        const borderEdges = new THREE.EdgesGeometry(planeGeometry);
        const borderMaterial = new THREE.LineBasicMaterial({ 
            color: 0xffcc00, 
            transparent: true, 
            opacity: 0.8             // 80% opaque so it stands out clearly
        });
        const border = new THREE.LineSegments(borderEdges, borderMaterial);

        // Add the border as a child of the plane so they stay locked together
        visualPlane.add(border);

        // 6. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        let currentStrokePoints = [];
        let currentStrokeMesh = null;

        // NEW: Independent altitude tracker for the sketchpad
        let drawingHeight = 0.01;

        // NEW: Tool State Configuration
        let activeTool = 'draw'; 

        const toolButtons = {
            draw: document.getElementById('tool-draw'),
            rotate: document.getElementById('tool-rotate'),
            select: document.getElementById('tool-select')
        };

        function changeTool(toolName) {
            activeTool = toolName;
            
            // Loop through buttons to toggle the 'active' highlight class
            Object.keys(toolButtons).forEach(key => {
                if (key === toolName) {
                    toolButtons[key].classList.add('active');
                } else {
                    toolButtons[key].classList.remove('active');
                }
            });

            // Remap camera controls based on the active tool
            if (activeTool === 'rotate') {
                controls.mouseButtons.LEFT = THREE.MOUSE.PAN;     // Left click pans the scene
                controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;  // Right click rotates
            } else {
                controls.mouseButtons.LEFT = THREE.MOUSE.NONE;    // Frees up left click for drawing
                controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;  // Right click rotates
            }
        }

        toolButtons.draw.addEventListener('click', () => changeTool('draw'));
        toolButtons.rotate.addEventListener('click', () => changeTool('rotate'));
        toolButtons.select.addEventListener('click', () => changeTool('select'));

        // 7. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            if (activeTool !== 'draw') return;
            if (event.button === 0) { 
                isDrawing = true;
                currentStrokePoints = [];
                currentStrokeMesh = null;
                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) {
                isDrawing = false;
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) {
                addPoint(event);
            }
        });

        // NEW: Scroll Wheel Elevator (Shift + Scroll to change height)
        window.addEventListener('wheel', (event) => {
            if (event.shiftKey) {
                // Stop OrbitControls from zooming the camera in and out
                event.stopImmediatePropagation(); 

                // Adjust sensitivity (smaller number = slower, smoother movement)
                const elevatorSpeed = event.deltaY * 0.001; 

                // Adjust only our independent height variable
                drawingHeight -= elevatorSpeed;
            }
        }, { capture: true }); // 'capture' ensures we catch the scroll before OrbitControls does

        // Arrow keys rotate strictly along the canvas's internal center lines (local axes)
        window.addEventListener('keydown', (event) => {
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) return;
            event.preventDefault(); 

            const rotationSpeed = 0.04; 

            if (event.key === 'ArrowUp') {
                // Rotates around the canvas's local horizontal axis
                visualPlane.rotateX(-rotationSpeed);
            } else if (event.key === 'ArrowDown') {
                // Rotates around the canvas's local horizontal axis
                visualPlane.rotateX(rotationSpeed);
            } else if (event.key === 'ArrowLeft') {
                // Rotates around the canvas's local vertical axis
                visualPlane.rotateY(-rotationSpeed);
            } else if (event.key === 'ArrowRight') {
                // Rotates around the canvas's local vertical axis
                visualPlane.rotateY(rotationSpeed);
            }
        });

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // CHANGED: Instead of an infinite math plane, we test collisions 
            // directly against our physical 8x8 yellow canvas mesh.
            const intersects = raycaster.intersectObject(visualPlane);
            
            // Only draw if the raycaster laser actually hits the yellow square
            if (intersects.length > 0) {
                const intersectionPoint = intersects[0].point;

                if (currentStrokePoints.length > 0) {
                    const lastPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    if (intersectionPoint.distanceTo(lastPoint) < 0.1) return;
                }

                currentStrokePoints.push(intersectionPoint.clone());

                const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });

                // 1. First click: Create a container Group and drop the starting sphere inside
                if (currentStrokePoints.length === 1) {
                    currentStrokeMesh = new THREE.Group(); 
                    scene.add(currentStrokeMesh);

                    const geometry = new THREE.SphereGeometry(0.08, 8, 8);
                    const startSphere = new THREE.Mesh(geometry, material);
                    startSphere.position.copy(intersectionPoint);
                    startSphere.name = "startSphere";
                    
                    currentStrokeMesh.add(startSphere);
                } 
                // 2. Dragging: Keep the start sphere, update the tube, and update the end sphere
                else if (currentStrokePoints.length > 1) {
                    
                    // Find and clean up the old tube mesh from the previous frame
                    const oldTube = currentStrokeMesh.getObjectByName("tube");
                    if (oldTube) {
                        currentStrokeMesh.remove(oldTube);
                        oldTube.geometry.dispose();
                    }

                    // Find and clean up the old end sphere from the previous frame
                    const oldEndSphere = currentStrokeMesh.getObjectByName("endSphere");
                    if (oldEndSphere) {
                        currentStrokeMesh.remove(oldEndSphere);
                        oldEndSphere.geometry.dispose();
                    }

                    // Build the updated tube geometry across all accumulated points
                    const curve = new THREE.CatmullRomCurve3(currentStrokePoints);
                    const tubeGeometry = new THREE.TubeGeometry(curve, currentStrokePoints.length * 2, 0.08, 8, false);
                    const tube = new THREE.Mesh(tubeGeometry, material);
                    tube.name = "tube";
                    currentStrokeMesh.add(tube);

                    // Build a brand new end sphere at the latest point
                    const sphereGeometry = new THREE.SphereGeometry(0.08, 8, 8);
                    const endSphere = new THREE.Mesh(sphereGeometry, material);
                    endSphere.position.copy(intersectionPoint);
                    endSphere.name = "endSphere";
                    currentStrokeMesh.add(endSphere);
                }
            }
        }

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
        
            // Keeps the yellow pad locked to our independent height variable
            visualPlane.position.y = drawingHeight;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
