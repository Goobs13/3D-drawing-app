<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Continuous Lines</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Continuous Drawing</h1>
        <p>Left Click + Drag: <b>Draw Smooth Lines</b><br>Right Click + Drag: <b>Rotate Camera</b></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;
        const drawingPlane = new THREE.Plane();

        // Arrays to manage the current active stroke
        let currentStrokePoints = [];
        let currentStrokeMesh = null;

        // 6. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            if (event.button === 0) { 
                isDrawing = true;
                
                // Reset tracking variables for a brand new stroke
                currentStrokePoints = [];
                currentStrokeMesh = null;

                // Lock the drawing plane's orientation to face the camera on the initial click
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                const planeNormal = cameraDirection.clone().negate();
                drawingPlane.setFromNormalAndCoplanarPoint(planeNormal, controls.target);

                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) {
                isDrawing = false;
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) {
                addPoint(event);
            }
        });

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectionPoint = new THREE.Vector3();
            
            if (raycaster.ray.intersectPlane(drawingPlane, intersectionPoint)) {
                
                // Optimization: Only add a new point if the mouse has moved a tiny bit away from the last point
                if (currentStrokePoints.length > 0) {
                    const lastPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    if (intersectionPoint.distanceTo(lastPoint) < 0.1) {
                        return; // Mouse barely moved, don't waste memory
                    }
                }

                currentStrokePoints.push(intersectionPoint.clone());

                // We need at least 2 points to draw a line segment
                if (currentStrokePoints.length > 1) {
                    
                    // Create a smooth mathematical curve passing through our array of points
                    const curve = new THREE.CatmullRomCurve3(currentStrokePoints);
                    
                    // Generate a 3D pipe geometry around that curve path
                    // Parameters: (path, tubularSegments, radius, radialSegments, closed)
                    const geometry = new THREE.TubeGeometry(curve, currentStrokePoints.length * 2, 0.08, 8, false);
                    const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });

                    // Clean up the old segment before drawing the updated, longer version
                    if (currentStrokeMesh) {
                        scene.remove(currentStrokeMesh);
                        currentStrokeMesh.geometry.dispose(); // Free up graphics card memory
                    }

                    // Create the new mesh and add it to our scene
                    currentStrokeMesh = new THREE.Mesh(geometry, material);
                    scene.add(currentStrokeMesh);
                }
            }
        }

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
