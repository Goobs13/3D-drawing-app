<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing App - Bounded Canvas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }


        #center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none; /* Allows clicks to pass right through it */
            opacity: 0.5;         /* Keeps it subtle and translucent */
        }
        /* Horizontal line of the plus */
        #center-crosshair::before {
            content: '';
            position: absolute;
            top: 7px;
            left: 0;
            width: 16px;
            height: 2px;
            background-color: #ffffff;
        }
        /* Vertical line of the plus */
        #center-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 7px;
            width: 2px;
            height: 16px;
            background-color: #ffffff;
        }

        /* Bottom Center Reset Button Styling */
        #reset-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 20px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background 0.2s ease;
        }
        #reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffcc00;
        }

        /* Top Right Save Panel Styling */
        #right-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 18px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            text-align: center;
            width: 140px;
        }
        .side-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00ff88;
        }

    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>3D Bounded Sketchpad</h1>
        <p>
            Left Click + Drag: <b>Draw inside the yellow canvas</b><br>
            Right Click + Drag: <b>Orbit Camera</b><br>
            Shift + Right Click: <b>Pan Camera</b><br>
            Shift + Scroll: <b>Change canvas height</b><br>
            Arrow Keys: <b>Rotate canvas</b>
        </p>
    </div>

    <div id="center-crosshair"></div>
    
    <button id="reset-btn">Reset Canvas</button>

    <div id="right-panel">
        <button id="save-json-btn" class="side-btn">Save Project</button>
        <button id="export-glb-btn" class="side-btn">Export 3D Asset</button>
        <button id="import-btn" class="side-btn">Import Project</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Setup Camera Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.screenSpacePanning = false; // Locks standard panning to X and Z axes
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // 3. Visual Grid Floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. CHANGED: Shrunk PlaneGeometry from (25, 25) to (8, 8)
        const planeGeometry = new THREE.PlaneGeometry(15, 15);
        const planeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const visualPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        visualPlane.rotation.x = -Math.PI / 2; // Rotates it flat like a floor
        visualPlane.position.y = 0.01;         // Sits slightly above the grid to avoid flickering
        scene.add(visualPlane);

        // Create a sharp, less transparent border around the edges
        const borderEdges = new THREE.EdgesGeometry(planeGeometry);
        const borderMaterial = new THREE.LineBasicMaterial({ 
            color: 0xffcc00, 
            transparent: true, 
            opacity: 0.8             // 80% opaque so it stands out clearly
        });
        const border = new THREE.LineSegments(borderEdges, borderMaterial);

        // Add the border as a child of the plane so they stay locked together
        visualPlane.add(border);

        // Add transparent blue lines across the local center axes of the canvas
        const axesPoints = [
            // Horizontal line across the middle (Local X)
            new THREE.Vector3(-7.5, 0, 0), new THREE.Vector3(7.5, 0, 0),
            // Vertical line across the middle (Local Y)
            new THREE.Vector3(0, -7.5, 0), new THREE.Vector3(0, 7.5, 0)
        ];
        
        const axesGeometry = new THREE.BufferGeometry().setFromPoints(axesPoints);
        const axesMaterial = new THREE.LineBasicMaterial({ 
            color: 0x00aaff, 
            transparent: true, 
            opacity: 0.4 
        });
        const localAxes = new THREE.LineSegments(axesGeometry, axesMaterial);
        
        visualPlane.add(localAxes);

        // 6. Drawing Logic Variables
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;

        let currentStrokePoints = [];
        let currentStrokeMesh = null;

        // NEW: Independent altitude tracker for the sketchpad
        let drawingHeight = 0.01;

        // Tracks which arrow keys are currently being held down
        const keysPressed = {};

        const masterProjectData = [];

        let hasUnsavedChanges = false; // Tracks if the user has unsaved work

        let fileHandle = null; // NEW: Remembers the saved file location

        // 7. Event Listeners
        window.addEventListener('pointerdown', (event) => {
            // NEW: Ignore the click if the user is clicking on a UI element
            if (event.target.closest('#right-panel') || event.target.closest('#ui-overlay') || event.target.closest('#reset-btn')) {
                return;
            }
            
            if (event.button === 0) { 
                isDrawing = true;
                currentStrokePoints = [];
                currentStrokeMesh = null;
                addPoint(event);
            }
        });

        window.addEventListener('pointerup', (event) => {
            if (event.button === 0) {
                isDrawing = false;
                if (currentStrokePoints.length > 0) {
                    masterProjectData.push(currentStrokePoints);
                    hasUnsavedChanges = true; // Mark project as modified
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDrawing) {
                addPoint(event);
            }
        });

        // NEW: Scroll Wheel Elevator (Shift + Scroll to change height)
        window.addEventListener('wheel', (event) => {
            if (event.shiftKey) {
                // Stop OrbitControls from zooming the camera in and out
                event.stopImmediatePropagation(); 

                // Adjust sensitivity (smaller number = slower, smoother movement)
                const elevatorSpeed = event.deltaY * 0.001; 

                // NEW: Translates the plane along its perpendicular local Z-axis
                visualPlane.translateZ(-elevatorSpeed);
            }
        }, { capture: true }); // 'capture' ensures we catch the scroll before OrbitControls does

        // Turn on the switch when a key is pressed down
        window.addEventListener('keydown', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                event.preventDefault(); 
                keysPressed[event.key] = true;
            }
        });

        // Turn off the switch the moment the key is released
        window.addEventListener('keyup', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                keysPressed[event.key] = false;
            }
        });

        // Intercept tab close or reload if there are unsaved strokes
        window.addEventListener('beforeunload', (event) => {
            if (hasUnsavedChanges) {
                event.preventDefault();
                event.returnValue = ''; // Standard browser requirement to trigger the prompt
            }
        });

        // Reset button logic to clear canvas height and rotation orientation
        document.getElementById('reset-btn').addEventListener('click', () => {
            // NEW: Resets X, Y, and Z positions entirely
            visualPlane.position.set(0, 0.01, 0);
            
            // Re-align canvas flat against the grid floor
            visualPlane.rotation.set(-Math.PI / 2, 0, 0);
        });

        document.getElementById('save-json-btn').addEventListener('click', async () => {
            if (masterProjectData.length === 0) return alert("Nothing to save yet!");
            
            // Bundle canvas settings and drawing data together
            const projectSaveData = {
                canvas: {
                    height: drawingHeight,
                    rotation: {
                        x: visualPlane.rotation.x,
                        y: visualPlane.rotation.y,
                        z: visualPlane.rotation.z
                    }
                },
                strokes: masterProjectData
            };
            const jsonString = JSON.stringify(projectSaveData);

            // Check if the browser supports the File System Access API
            if ('showSaveFilePicker' in window) {
                try {
                    // If we don't have a handle yet, prompt the user to choose a location
                    if (!fileHandle) {
                        const options = {
                            suggestedName: 'my-3d-drawing-project.json',
                            types: [{
                                description: 'JSON Files',
                                accept: { 'application/json': ['.json'] }
                            }]
                        };
                        fileHandle = await window.showSaveFilePicker(options);
                    }

                    // Write directly to the existing file handle
                    const writable = await fileHandle.createWritable();
                    await writable.write(jsonString);
                    await writable.close();

                    hasUnsavedChanges = false;
                    alert("Project updated successfully!");
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error(err);
                        alert("Failed to save file.");
                    }
                }
            } else {
                // Fallback for older browsers (always downloads a new file)
                const blob = new Blob([jsonString], { type: "application/json" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "my-3d-drawing-project.json";
                link.click();
                hasUnsavedChanges = false;
            }
        });

        document.getElementById('export-glb-btn').addEventListener('click', () => {
            const exporter = new GLTFExporter();
            const exportGroup = new THREE.Group();
            
            scene.children.forEach(child => {
                if (child.isGroup) exportGroup.add(child.clone());
            });

            if (exportGroup.children.length === 0) return alert("No 3D meshes to export!");

            exporter.parse(exportGroup, (gltf) => {
                const blob = new Blob([gltf], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "drawing-mesh.glb";
                link.click();
            }, (error) => {
                console.error("An error occurred during GLTF export:", error);
            }, { binary: true });
        });

        // Load an existing project and lock onto its hardware file path
        document.getElementById('import-btn').addEventListener('click', async () => {
            if ('showOpenFilePicker' in window) {
                try {
                    // Open a native system file browser
                    const [handle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'JSON Files',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });
                    
                    const file = await handle.getFile();
                    const text = await file.text();
                    
                    // Run the rendering pipeline on the JSON data
                    processImportedProject(text);
                    
                    // CRITICAL FIX: Lock the app's save tracking pointer onto this file path
                    fileHandle = handle; 
                    
                } catch (err) {
                    if (err.name !== 'AbortError') alert("Error opening project file.");
                }
            } else {
                // Backward compatibility fallback for older browsers
                const legacyInput = document.createElement('input');
                legacyInput.type = 'file';
                legacyInput.accept = '.json';
                legacyInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        processImportedProject(evt.target.result);
                        fileHandle = null; 
                    };
                    reader.readAsText(file);
                };
                legacyInput.click();
            }
        });

        // Pipeline to parse JSON structures and regenerate 3D canvas meshes
        function processImportedProject(jsonText) {
            try {
                const importedData = JSON.parse(jsonText);
                let strokesToLoad = [];

                if (importedData.canvas && Array.isArray(importedData.strokes)) {
                    drawingHeight = importedData.canvas.height;
                    visualPlane.position.y = drawingHeight;
                    visualPlane.rotation.set(
                        importedData.canvas.rotation.x,
                        importedData.canvas.rotation.y,
                        importedData.canvas.rotation.z
                    );
                    strokesToLoad = importedData.strokes;
                } else if (Array.isArray(importedData)) {
                    strokesToLoad = importedData;
                } else {
                    return alert("Invalid file format.");
                }

                // Empty out old meshes and purge GPU resources
                scene.children.slice().forEach(child => {
                    if (child.isGroup) {
                        child.traverse((object) => {
                            if (object.isMesh) {
                                if (object.geometry) object.geometry.dispose();
                                if (object.material) {
                                    if (Array.isArray(object.material)) {
                                        object.material.forEach(mat => mat.dispose());
                                    } else {
                                        object.material.dispose();
                                    }
                                }
                            }
                        });
                        scene.remove(child);
                    }
                });
                masterProjectData.length = 0;

                // Re-instantiate meshes from vector data paths
                strokesToLoad.forEach(strokePointsData => {
                    const reconstructedPoints = strokePointsData.map(p => new THREE.Vector3(p.x, p.y, p.z));
                    masterProjectData.push(reconstructedPoints);

                    const strokeGroup = new THREE.Group();
                    const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });

                    const startGeo = new THREE.SphereGeometry(0.08, 8, 8);
                    const startSphere = new THREE.Mesh(startGeo, material);
                    startSphere.position.copy(reconstructedPoints[0]);
                    startSphere.name = "startSphere";
                    strokeGroup.add(startSphere);

                    if (reconstructedPoints.length > 1) {
                        const curve = new THREE.CatmullRomCurve3(reconstructedPoints);
                        const tubeGeometry = new THREE.TubeGeometry(curve, reconstructedPoints.length * 2, 0.08, 8, false);
                        const tube = new THREE.Mesh(tubeGeometry, material);
                        tube.name = "tube";
                        strokeGroup.add(tube);

                        const endGeo = new THREE.SphereGeometry(0.08, 8, 8);
                        const endSphere = new THREE.Mesh(endGeo, material);
                        endSphere.position.copy(reconstructedPoints[reconstructedPoints.length - 1]);
                        endSphere.name = "endSphere";
                        strokeGroup.add(endSphere);
                    }
                    scene.add(strokeGroup);
                });

                hasUnsavedChanges = false;
            } catch (err) {
                alert("Error rendering the imported project configuration.");
            }
        }

        function addPoint(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // CHANGED: Instead of an infinite math plane, we test collisions 
            // directly against our physical 8x8 yellow canvas mesh.
            const intersects = raycaster.intersectObject(visualPlane, false);
            
            // Only draw if the raycaster laser actually hits the yellow square
            if (intersects.length > 0) {
                const intersectionPoint = intersects[0].point;

                if (currentStrokePoints.length > 0) {
                    const lastPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    if (intersectionPoint.distanceTo(lastPoint) < 0.1) return;
                }

                currentStrokePoints.push(intersectionPoint.clone());

                const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3 });

                // 1. First click: Create a container Group and drop the starting sphere inside
                if (currentStrokePoints.length === 1) {
                    currentStrokeMesh = new THREE.Group(); 
                    scene.add(currentStrokeMesh);

                    const geometry = new THREE.SphereGeometry(0.08, 8, 8);
                    const startSphere = new THREE.Mesh(geometry, material);
                    startSphere.position.copy(intersectionPoint);
                    startSphere.name = "startSphere";
                    
                    currentStrokeMesh.add(startSphere);
                } 
                // 2. Dragging: Keep the start sphere, update the tube, and update the end sphere
                else if (currentStrokePoints.length > 1) {
                    
                    // Find and clean up the old tube mesh from the previous frame
                    const oldTube = currentStrokeMesh.getObjectByName("tube");
                    if (oldTube) {
                        currentStrokeMesh.remove(oldTube);
                        oldTube.geometry.dispose();
                    }

                    // Find and clean up the old end sphere from the previous frame
                    const oldEndSphere = currentStrokeMesh.getObjectByName("endSphere");
                    if (oldEndSphere) {
                        currentStrokeMesh.remove(oldEndSphere);
                        oldEndSphere.geometry.dispose();
                    }

                    // Build the updated tube geometry across all accumulated points
                    const curve = new THREE.CatmullRomCurve3(currentStrokePoints);
                    const tubeGeometry = new THREE.TubeGeometry(curve, currentStrokePoints.length * 2, 0.08, 8, false);
                    const tube = new THREE.Mesh(tubeGeometry, material);
                    tube.name = "tube";
                    currentStrokeMesh.add(tube);

                    // Build a brand new end sphere at the latest point
                    const sphereGeometry = new THREE.SphereGeometry(0.08, 8, 8);
                    const endSphere = new THREE.Mesh(sphereGeometry, material);
                    endSphere.position.copy(intersectionPoint);
                    endSphere.name = "endSphere";
                    currentStrokeMesh.add(endSphere);
                }
            }
        }

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
        
            // NEW: Smoothly rotates the canvas if a key switch is active
            // (Lowered speed slightly because this now executes up to 60+ times per second)
            const frameRotationSpeed = 0.005; 
            
            if (keysPressed['ArrowUp']) {
                visualPlane.rotateX(-frameRotationSpeed);
            }
            if (keysPressed['ArrowDown']) {
                visualPlane.rotateX(frameRotationSpeed);
            }
            if (keysPressed['ArrowLeft']) {
                visualPlane.rotateY(-frameRotationSpeed);
            }
            if (keysPressed['ArrowRight']) {
                visualPlane.rotateY(frameRotationSpeed);
            }
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
